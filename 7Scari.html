<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7 Ladders Canyon | Summit & Solitude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script>
(function(){
  var t = localStorage.getItem('theme');
  if(!t){ t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root {
  --bg: #0a0f0a;
  --bg-elev: #0f1a0f;
  --surface: #141f14;
  --border: #1f2f1f;
  --text: #e8f0e8;
  --text-dim: #8a9a8a;
  --accent: #4ade80;
  --accent-2: #22c55e;
  --accent-soft: rgba(74,222,128,0.12);
  --radius: 16px;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Inter', sans-serif;
  --display: 'Space Grotesk', sans-serif;
}
[data-theme="light"] {
  --bg: #f0fdf4;
  --bg-elev: #dcfce7;
  --surface: #ffffff;
  --border: #bbf7d0;
  --text: #14532d;
  --text-dim: #3f6212;
  --accent: #16a34a;
  --accent-2: #15803d;
  --accent-soft: rgba(22,163,74,0.10);
}
*, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background .3s ease, color .3s ease;
}
img { display:block; max-width:100%; }
a { color: inherit; text-decoration:none; }
button { font: inherit; background:none; border:none; cursor:pointer; color:inherit; }

/* ========== NAV ========== */
.nav {
  position: fixed; top:0; left:0; right:0; z-index:100;
  padding: 1.2rem 0;
  transition: background .3s, backdrop-filter .3s, border-color .3s;
  border-bottom: 1px solid transparent;
}
.nav.scrolled {
  background: rgba(10,15,10,0.88);
  backdrop-filter: blur(14px);
  border-bottom-color: var(--border);
}
[data-theme="light"] .nav.scrolled { background: rgba(240,253,244,0.88); }
.nav-inner {
  width: min(1200px, 92%); margin-inline:auto;
  display:flex; align-items:center; justify-content:space-between;
}
.nav-logo {
  font-family: var(--display); font-weight:700; font-size:1.15rem;
  display:flex; align-items:center; gap:.6rem; letter-spacing:-0.02em;
}
.nav-logo svg { width:28px; height:28px; color:var(--accent); }
.nav-right { display:flex; align-items:center; gap:2.2rem; }
.back-link {
  font-size:.82rem; text-transform:uppercase; letter-spacing:.12em;
  color: var(--text-dim); transition: color .2s; font-weight:600;
  display: flex; align-items: center; gap: 0.4rem;
}
.back-link:hover { color: var(--accent); }
.nav-controls { display:flex; align-items:center; gap:.6rem; }
.directive-toggle {
  height:34px; padding:0 .65rem; border:1px solid var(--border); border-radius:8px;
  display:flex; align-items:center; gap:.35rem; font-size:.72rem;
  color:var(--text-dim); cursor:pointer; transition: all .2s ease; user-select:none;
  font-family: var(--display); background: transparent;
}
.directive-toggle:hover { border-color: var(--accent); background: var(--accent-soft); }
.directive-toggle .d-kw { color: var(--accent-2); }
.directive-toggle .d-name { color: var(--text-dim); }
.directive-toggle .d-val { color: var(--accent); font-weight:700; min-width: 2.2ch; text-align:left; }

/* ========== ARTICLE HERO ========== */
.article-hero {
  position: relative;
  min-height: 70vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 100px 1.5rem 4rem;
  background-image: 
    linear-gradient(to bottom, rgba(10, 15, 10, 0.4) 0%, rgba(10, 15, 10, 0.95) 100%),
    url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1600&q=80');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}
[data-theme="light"] .article-hero {
  background-image: 
    linear-gradient(to bottom, rgba(240, 253, 244, 0.3) 0%, rgba(240, 253, 244, 0.95) 100%),
    url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1600&q=80');
}
.article-title {
  z-index: 2;
  max-width: 900px;
}
.article-title h1 {
  font-family: var(--serif); font-size: clamp(3rem, 7vw, 5.5rem);
  font-weight: 700; line-height: 1.1; margin-bottom: 1rem;
}

/* ========== ARTICLE LAYOUT ========== */
.container { width: min(1100px, 92%); margin-inline:auto; }

.article-grid {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 2.5rem;
  margin-top: -3rem; 
  position: relative;
  z-index: 10;
  align-items: start;
}

/* Stats Sidebar */
.stats-sidebar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 2rem;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}
[data-theme="light"] .stats-sidebar { box-shadow: 0 20px 40px rgba(20,83,45,0.08); }
.stats-list { list-style: none; display: flex; flex-direction: column; gap: 1.2rem; }
.stat-item {
  display: flex; flex-direction: column; gap: 0.2rem;
  padding-bottom: 1.2rem; border-bottom: 1px solid var(--border);
}
.stat-item:last-child { border-bottom: none; padding-bottom: 0; }
.stat-lbl { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); }
.stat-val { font-family: var(--display); font-size: 1.1rem; font-weight: 600; color: var(--accent-2); }

/* Map Box */
.map-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  height: 100%;
  min-height: 400px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}
[data-theme="light"] .map-container { box-shadow: 0 20px 40px rgba(20,83,45,0.08); }
.map-container iframe {
  width: 100%; height: 100%; min-height: 400px; border: none; display: block;
}

/* Narrative Section */
.article-body {
  max-width: 760px;
  margin: 5rem auto;
}
.article-body p {
  font-size: 1.1rem; line-height: 1.8; color: var(--text);
  margin-bottom: 2rem;
}
.article-body img {
  border-radius: var(--radius);
  margin: 3rem 0;
  border: 1px solid var(--border);
}
.article-body .caption {
  text-align: center; font-size: 0.85rem; color: var(--text-dim);
  font-style: italic; margin-top: -2rem; margin-bottom: 3rem;
}

@media (max-width: 850px) {
  .article-grid { grid-template-columns: 1fr; margin-top: 2rem; }
  .map-container { min-height: 300px; }
  .map-container iframe { min-height: 300px; }
}

/* ========== FOOTER ========== */
.footer { border-top: 1px solid var(--border); padding: 3rem 0; text-align:center; margin-top: 4rem; }
.footer p { font-family: var(--serif); font-style:italic; color: var(--text-dim); font-size:1rem; }
</style>

<!-- LEAFLET MAPS & GPX PLUGIN -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
<style>
  .leaflet-top, .leaflet-bottom { z-index: 90 !important; }
  [data-theme="dark"] .map-container { filter: brightness(0.85) contrast(1.1); }
</style>

</head>
<body>

<nav class="nav" id="nav">
  <div class="nav-inner">
    <a href="hiking.html" class="nav-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 20l6-10 4 6 2-3 6 7z"/>
        <circle cx="14" cy="6" r="2"/>
      </svg>
    </a>
    <div class="nav-right">
      <a href="hiking.html" class="back-link" data-i18n="nav.back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span data-i18n="nav.backText">Back to Journal</span>
      </a>
      <div class="nav-controls">
        <button class="directive-toggle" id="langToggle" type="button" aria-label="Toggle language">
          <span class="d-name">LANG</span><span class="d-val" id="langVal">EN</span>
        </button>
        <button class="directive-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
          <span class="d-name">THEME</span><span class="d-val" id="themeVal">DARK</span>
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- HERO -->
<header class="article-hero">
  <div class="article-title">
    <h1 data-i18n="hike.title">7 Ladders Canyon</h1>
  </div>
</header>

<!-- STATS & MAP GRID -->
<div class="container">
  <div class="article-grid">
    
    <aside class="stats-sidebar">
      <ul class="stats-list">
        <li class="stat-item">
          <span class="stat-lbl" data-i18n="stats.durationLbl">Duration</span>
          <span class="stat-val" data-i18n="stats.durationVal">3.5 hours</span>
        </li>
        <li class="stat-item">
          <span class="stat-lbl" data-i18n="stats.elevationLbl">Elevation</span>
          <span class="stat-val" data-i18n="stats.elevationVal">948 m</span>
        </li>
        <li class="stat-item">
          <span class="stat-lbl" data-i18n="stats.difficultyLbl">Difficulty</span>
          <span class="stat-val" data-i18n="stats.difficultyVal">3/10</span>
        </li>
        <li class="stat-item">
          <span class="stat-lbl" data-i18n="stats.viewLbl">View</span>
          <span class="stat-val" data-i18n="stats.viewVal">3/5</span>
        </li>
        <li class="stat-item">
          <span class="stat-lbl" data-i18n="stats.accessLbl">Access</span>
          <span class="stat-val" data-i18n="stats.accessVal">5/5 (Near Brașov)</span>
        </li>
      </ul>
    </aside>

    <div class="map-container" id="trailMap"></div>
    
  </div>
</div>

<!-- NARRATIVE TEXT & PHOTOS -->
<main class="container">
  <article class="article-body">
    <p data-i18n="article.p1"></p>
    
    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1000&q=80" alt="Forest Trail Walk">
    <p class="caption" data-i18n="article.cap1"></p>

    <p data-i18n="article.p2"></p>
    
    <p data-i18n="article.p3"></p>

    <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1000&q=80" alt="Mist and Waterfalls">
    <p class="caption" data-i18n="article.cap2"></p>

    <p data-i18n="article.p4"></p>
  </article>
</main>

<footer class="footer">
  <div class="container">
    <p data-i18n="footer.quote">"The mountains are calling and I must go."</p>
  </div>
</footer>

<script>
const i18n = {
  en: {
    nav: { backText: "Back to Journal" },
    hike: { title: "7 Ladders Canyon (Canionul 7 Scări)" },
    stats: {
      durationLbl: "Duration", durationVal: "3.5 hours",
      elevationLbl: "Elevation", elevationVal: "948 m",
      difficultyLbl: "Difficulty", difficultyVal: "3/10",
      viewLbl: "View", viewVal: "3/5",
      accessLbl: "Access", accessVal: "5/5 (Near Brașov)"
    },
    article: {
      p1: "Our hike to the 7 Ladders Canyon started in the Dâmbu Morii area, just a short drive from Brașov. The approach is extremely accessible, making it a popular choice. We followed the yellow stripe trail, enjoying an easy, relaxing walk through a lush forest alongside the Șipoaia Valley. After roughly an hour of gentle incline, hearing the increasing roar of the water, we arrived at the small wooden cabin where you pay the entrance fee to access the gorge.",
      cap1: "The relaxing forest approach along the Șipoaia Valley.",
      p2: "Once past the turnstile, the true character of the Jurassic limestone canyon reveals itself. The gorge is incredibly narrow—in some places, you can touch both walls with your outstretched arms. The main attraction is, of course, the seven near-vertical metal ladders bolted directly into the rock face. As you climb, the waterfalls cascade right next to you, and in some spots, directly under or slightly over you. It's an intensely wet, refreshing, and thrilling environment.",
      p3: "Climbing the ladders requires focus and good footing, especially since the metal rungs are constantly slick with spray. The longest ladder stretches up about 15 meters, testing your grip and balance. Because of the confined space and the roaring water echoing off the stone, it’s almost impossible to hear each other inside the canyon. However, the cold mist blowing off the cascades serves as the perfect natural air conditioning.",
      cap2: "Navigating the slick ladders right beside the rushing falls.",
      p4: "Emerging at the top of the final ladder feels like stepping into a different world as the gorge suddenly opens back up into a quiet forest. Because the ladders are dangerously steep, the canyon operates strictly as a one-way trail upwards. For the return trip, we followed the red dot trail, which forms a bypass route winding through the forest back down to the entrance cabin. From there, it was an easy descent back to Dâmbu Morii. It’s a short, highly dynamic hike that guarantees you won't leave completely dry."
    },
    footer: { quote: "\"The mountains are calling and I must go.\"" }
  },
  ro: {
    nav: { backText: "Înapoi la Jurnal" },
    hike: { title: "Canionul 7 Scări" },
    stats: {
      durationLbl: "Durată", durationVal: "3.5 ore",
      elevationLbl: "Altitudine", elevationVal: "948 m",
      difficultyLbl: "Dificultate", difficultyVal: "3/10",
      viewLbl: "Priveliște", viewVal: "3/5",
      accessLbl: "Acces", accessVal: "5/5 (Lângă Brașov)"
    },
    article: {
      p1: "Drumeția noastră spre Canionul 7 Scări a început în zona Dâmbu Morii, la o scurtă distanță cu mașina de Brașov. Accesul este extrem de facil, ceea ce îl face o alegere foarte populară. Am urmat traseul marcat cu bandă galbenă, bucurându-ne de o plimbare ușoară și relaxantă printr-o pădure deasă, de-a lungul văii Șipoaia. După aproximativ o oră de urcare lină, auzind vuietul tot mai puternic al apei, am ajuns la cabana de lemn unde se plătește taxa de intrare în defileu.",
      cap1: "Apropierea relaxantă prin pădure, pe valea Șipoaia.",
      p2: "Odată trecuți de turnicheți, adevăratul caracter al canionului de calcar jurasic iese la iveală. Defileul este incredibil de îngust — în unele locuri poți atinge ambii pereți dacă întinzi brațele. Atracția principală este, desigur, seria de șapte scări metalice aproape verticale, ancorate direct în stâncă. Pe măsură ce urci, cascadele curg fix pe lângă tine, iar în unele locuri, chiar pe sub sau ușor peste tine. Este un mediu ud, răcoros și plin de suspans.",
      p3: "Urcarea pe scări necesită concentrare și pași siguri, mai ales că treptele metalice sunt constant alunecoase din cauza apei. Cea mai lungă scară are o înălțime de aproximativ 15 metri, testându-ți prizele și echilibrul. Din cauza spațiului îngust și a apei învolburate care răsună din piatră, este aproape imposibil să te auzi cu ceilalți în interiorul canionului. Cu toate acestea, ceața rece care se ridică din cascade funcționează ca un aer condiționat natural perfect.",
      cap2: "Urcând pe scările alunecoase, chiar lângă căderile de apă.",
      p4: "Ieșirea de pe ultima scară te face să te simți ca și cum ai păși într-o altă lume, pe măsură ce cheile se deschid brusc într-o pădure liniștită. Deoarece scările sunt periculos de abrupte, canionul funcționează strict ca un traseu cu sens unic, doar la urcare. Pentru întoarcere, am urmat traseul cu punct roșu, care reprezintă o rută ocolitoare prin pădure ce te aduce înapoi la cabana de la intrare. De acolo, a urmat o coborâre ușoară înapoi spre Dâmbu Morii. Este o drumeție scurtă, foarte dinamică, ce garantează că nu vei pleca acasă complet uscat."
    },
    footer: { quote: "„Munții cheamă și trebuie să plec.”" }
  }
};

let currentLang = localStorage.getItem('lang') || (navigator.language.toLowerCase().startsWith('ro') ? 'ro' : 'en');

function t(path) {
  return path.split('.').reduce((o,k) => (o ? o[k] : undefined), i18n[currentLang]);
}

function applyLanguage() {
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const val = t(el.getAttribute('data-i18n'));
    if (typeof val === 'string') el.textContent = val;
  });
  document.getElementById('langVal').textContent = currentLang.toUpperCase();
  localStorage.setItem('lang', currentLang);
}

/* Theme toggle */
document.getElementById('themeToggle').addEventListener('click', () => {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.getElementById('themeVal').textContent = next.toUpperCase();
});

/* Language toggle */
document.getElementById('langToggle').addEventListener('click', () => {
  currentLang = currentLang === 'en' ? 'ro' : 'en';
  applyLanguage();
});

/* Nav scroll effect */
const nav = document.getElementById('nav');
window.addEventListener('scroll', () => {
  nav.classList.toggle('scrolled', window.pageYOffset > 60);
});

/* ========== TRAIL MAP (LEAFLET + GPX) ========== */
function initTrailMap() {
  const mapElement = document.getElementById('trailMap');
  if (!mapElement) return;

  // Create the map (no need to set coordinates, the GPX file will auto-center it)
  const map = L.map('trailMap');

  // Add OpenTopoMap layer (the exact terrain map style from your screenshot)
  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    maxZoom: 17,
    attribution: '&copy; OpenStreetMap &copy; OpenTopoMap'
  }).addTo(map);

  // ---------- ADD YOUR GPX FILE HERE ----------
  // You need to download the GPX file for Valea lui Stan and put it in your website's folder
  const gpxFile = '7_scari.gpx'; 

  new L.GPX(gpxFile, {
    async: true,
    marker_options: {
      // These place default Start and End pins on the map
      startIconUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/pin-icon-start.png',
      endIconUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/pin-icon-end.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/pin-shadow.png'
    },
    polyline_options: {
      color: '#0ea5e9', // The exact blue color from your screenshot
      weight: 4,
      opacity: 0.9,
      lineCap: 'round',
      lineJoin: 'round'
    }
  }).on('loaded', function(e) {
    // Auto-adjust the map zoom and position to fit the entire trail perfectly
    map.fitBounds(e.target.getBounds(), { padding: [40, 40] });
  }).addTo(map);
}

// Initialize the map
initTrailMap();

/* Init */
document.getElementById('themeVal').textContent = document.documentElement.getAttribute('data-theme').toUpperCase();
applyLanguage();
</script>

</body>
</html>
